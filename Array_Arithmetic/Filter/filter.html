<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Characters</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link  rel='stylesheet' href="./array_arithmetic.css"/>
       
    
</head>
<body>
    <!-- Starfield Background -->
    <div class="starfield"></div>

    <div class="search-container">
        <h1 id="starWars">Search A Far Away Galaxy</h1>
        <form>
            <div class="input-group">
                <input type="text" class="form-control" placeholder="name a Star Wars character...">
                <button class="btn btn-search" type="submit">Search</button>
            </div>
        </form>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // JavaScript to create stars dynamically
        const starfield = document.querySelector('.starfield');

        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.top = `${Math.random() * 100}vh`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.animationDuration = `${Math.random() * 3 + 1}s`;
            starfield.appendChild(star);
        }
    </script>
</body>
</html>

<script src="./filterMethod.js"></script>
