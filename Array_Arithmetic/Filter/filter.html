<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Star Wars Characters</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link  rel='stylesheet' href="./array_arithmetic.css"/>
       
    
</head>
<body>
    <!-- Starfield Background -->
    <div class="starfield"></div>

    <div class="search-container">
        <h1 id="starWars">Search A Far Away Galaxy</h1>
        <form>
            <div class="input-group">
                <input type="text" class="form-control" placeholder="name a Star Wars character...">
                <button class="btn btn-search" type="submit">Search</button>
            </div>
        </form>
        <div id="resultsBox">
        </div>

    </div>
      <!-- Hidden Button -->
      <button class="hidden-btn" data-bs-toggle="modal" data-bs-target="#characterModal">
        Characters
    </button>

    <!-- Modal -->
    <div class="modal fade" id="characterModal" tabindex="-1" aria-labelledby="characterModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="characterModalLabel">Roster To Choose From</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p>Luke Skywalker is a Jedi Knight who played a pivotal role in the defeat of the Galactic Empire. He is the son of Anakin Skywalker (Darth Vader) and Padmé Amidala, and the twin brother of Leia Organa.</p>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // create stars dynamically
        const starfield = document.querySelector('.starfield');

        for (let i = 0; i < 150; i++) {
            const star = document.createElement('div');
            star.className = 'star';
            star.style.top = `${Math.random() * 100}vh`;
            star.style.left = `${Math.random() * 100}vw`;
            star.style.animationDuration = `${Math.random() * 3 + 1}s`;
            starfield.appendChild(star);
        }
    </script>
</body>
</html>

<script src="./filterMethod.js"></script>
