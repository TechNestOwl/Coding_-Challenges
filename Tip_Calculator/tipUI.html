<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tip Calculator</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        /* Custom styling to make the button group look like a set of selectable buttons */
        .btn-check:checked + .btn {
            background-color: #007bff;
            color: white;
        }
        .btn-check:focus + .btn {
            box-shadow: none;
        }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header text-center">
                        <h3>Tip Calculator</h3>
                    </div>
                    <div class="card-body">
                        <form>
                            <div class="mb-3">
                                <label for="amount" class="form-label">Bill Amount</label>
                                <input type="number" class="form-control" id="billAmount" name="billAmount" placeholder="Enter bill amount" required>
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Satisfaction:</label>
                                <div class="btn-group w-100" role="group">
                                    <input type="radio" class="btn-check" name="tip" id="poor" value="poor" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="poor">Poor</label>

                                    <input type="radio" class="btn-check" name="tip" id="fair" value="fair" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="fair">Fair</label>

                                    <input type="radio" class="btn-check" name="tip" id="excellent" value="excellent" autocomplete="off">
                                    <label class="btn btn-outline-primary" for="excellent">Excellent</label>
                                </div>
                            </div>

                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary" onClick={displayTotal()}>Submit</button>
                            </div>
                        </form>
                        <div id="results">
                            <p>Results...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS and dependencies -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script src="./tipLogic.js"></script>
</body>
</html>
